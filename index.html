<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Sign-in</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="card">

        <div class="left">
            <img src="google-logo.png" alt="Google Logo" width="100">

            <h1>Sign in</h1>
            <p class="subtitle">Use your Google Account</p>
        </div>

        <div class="right">
            <form>
                <input type="email" placeholder="Email or phone" required>

                <a href="#" class="link">Forgot email?</a>

                <p class="info">
                </p>

                <div class="buttons">
                <a href="#" class="create">Create account</a>
                <button type="submit">Next</button>
                </div>

            </form>

        </div>

    </div>

    <div class="footer">
        <span>English (United States)</span>
        <span>Help • Privacy • Terms</span>
    </div>

</div>

</body>
</html>
